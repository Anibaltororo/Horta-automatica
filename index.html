<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Horta Escolar - Login</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background: linear-gradient(135deg, #1b5e20 0%, #2e8b57 50%, #4caf50 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container-login {
      width: 100%;
      max-width: 420px;
    }

    .card-login {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      overflow: hidden;
      animation: slideUp 0.5s ease;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .header-login {
      background: linear-gradient(135deg, #1b5e20 0%, #2e8b57 100%);
      padding: 40px 30px;
      text-align: center;
      color: #fff;
    }

    .logo-grande {
      font-size: 56px;
      margin-bottom: 12px;
      display: block;
    }

    .header-login h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }

    .header-login p {
      font-size: 14px;
      opacity: 0.9;
      font-weight: 500;
    }

    .content-login {
      padding: 40px;
    }

    /* TABS */
    .tabs {
      display: flex;
      gap: 12px;
      margin-bottom: 28px;
      border-bottom: 2px solid #f0f0f0;
    }

    .tab-btn {
      flex: 1;
      background: none;
      border: none;
      padding: 12px;
      font-size: 14px;
      font-weight: 600;
      color: #999;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: all 0.3s;
      position: relative;
      bottom: -2px;
    }

    .tab-btn:hover {
      color: #2e8b57;
    }

    .tab-btn.active {
      color: #1b5e20;
      border-bottom-color: #1b5e20;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* INPUTS */
    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: #333;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px 14px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      transition: all 0.3s;
      background: #f9f9f9;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: #2e8b57;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(46, 139, 87, 0.1);
    }

    input::placeholder {
      color: #999;
    }

    /* BOTÕES */
    .btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s;
      letter-spacing: 0.5px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #1b5e20 0%, #2e8b57 100%);
      color: #fff;
      box-shadow: 0 4px 15px rgba(27, 94, 32, 0.3);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 25px rgba(27, 94, 32, 0.4);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-secondary {
      background: #f0f0f0;
      color: #333;
      font-weight: 600;
    }

    .btn-secondary:hover {
      background: #e0e0e0;
    }

    /* MENSAGENS */
    .erro {
      background: #fee;
      color: #c33;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 16px;
      font-size: 13px;
      border-left: 4px solid #c33;
      display: none;
    }

    .erro.show {
      display: block;
      animation: shake 0.3s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }

    .sucesso {
      background: #efe;
      color: #3a3;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 16px;
      font-size: 13px;
      border-left: 4px solid #3a3;
      display: none;
    }

    .sucesso.show {
      display: block;
    }

    /* TIPO USUÁRIO */
    .tipo-grupo {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 18px;
    }

    .tipo-opcao {
      position: relative;
    }

    .tipo-opcao input[type="radio"] {
      display: none;
    }

    .tipo-label {
      display: block;
      padding: 14px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
      background: #f9f9f9;
      font-weight: 600;
      font-size: 13px;
    }

    .tipo-opcao input[type="radio"]:checked + .tipo-label {
      border-color: #2e8b57;
      background: linear-gradient(135deg, #f0fdf4 0%, #e8f5e9 100%);
      color: #1b5e20;
    }

    /* INFO */
    .info-box {
      background: linear-gradient(135deg, #f0fdf4 0%, #e8f5e9 100%);
      padding: 14px;
      border-radius: 8px;
      margin-bottom: 16px;
      border-left: 4px solid #2e8b57;
      font-size: 13px;
      color: #2e8b57;
      line-height: 1.5;
    }

    .info-box strong {
      display: block;
      margin-bottom: 6px;
    }

    /* RODAPÉ */
    .footer-login {
      text-align: center;
      padding: 20px 30px;
      border-top: 1px solid #f0f0f0;
      background: #f9f9f9;
      color: #666;
      font-size: 12px;
    }

    /* RESPONSIVE */
    @media (max-width: 480px) {
      .container-login {
        max-width: 100%;
      }

      .header-login {
        padding: 30px 20px;
      }

      .logo-grande {
        font-size: 48px;
      }

      .header-login h1 {
        font-size: 24px;
      }

      .content-login {
        padding: 30px 20px;
      }

      .tipo-grupo {
        grid-template-columns: 1fr;
      }
    }

    .link-auth {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      color: #666;
    }

    .link-auth a {
      color: #2e8b57;
      text-decoration: none;
      font-weight: 600;
    }

    .link-auth a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container-login">
    <div class="card-login">
      <!-- HEADER -->
      <div class="header-login">
        <span class="logo-grande">🌱</span>
        <h1>Horta Escolar</h1>
        <p>Educação e Tecnologia</p>
      </div>

      <!-- CONTENT -->
      <div class="content-login">
        <!-- TABS -->
        <div class="tabs">
          <button class="tab-btn active" onclick="mudarAba('login')">🔐 Login</button>
          <button class="tab-btn" onclick="mudarAba('registro')">📝 Cadastro</button>
        </div>

        <!-- ===== ABA LOGIN ===== -->
        <div id="login" class="tab-content active">
          <div id="erroLogin" class="erro"></div>
          <div id="sucessoLogin" class="sucesso"></div>

          <div class="form-group">
            <label>📧 Email</label>
            <input id="emailLogin" type="email" placeholder="seu.email@escola.com">
          </div>

          <div class="form-group">
            <label>🔑 Senha</label>
            <input id="senhaLogin" type="password" placeholder="••••••••">
          </div>

          <button id="btnLogin" class="btn btn-primary">🚪 Entrar</button>

          <div class="link-auth">
            Não tem conta? <a href="registro.html">Crie uma aqui</a>
          </div>
        </div>

        <!-- ===== ABA REGISTRO ===== -->
        <div id="registro" class="tab-content">
          <div id="erroRegistro" class="erro"></div>
          <div id="sucessoRegistro" class="sucesso"></div>

          <div class="info-box">
            ⚠️ <strong>Atenção:</strong> Alunos usam esta área para se cadastrar. Professores devem ser cadastrados pelo administrador.
          </div>

          <div class="form-group">
            <label>👤 Nome Completo</label>
            <input id="nomeRegistro" type="text" placeholder="João Silva">
          </div>

          <div class="form-group">
            <label>Você é:</label>
            <div class="tipo-grupo">
              <div class="tipo-opcao">
                <input type="radio" id="tipoAluno" name="tipo" value="aluno" checked>
                <label for="tipoAluno" class="tipo-label">👨‍🎓 Aluno</label>
              </div>
              <div class="tipo-opcao">
                <input type="radio" id="tipoProfessor" name="tipo" value="professor">
                <label for="tipoProfessor" class="tipo-label">👨‍🏫 Professor</label>
              </div>
            </div>
          </div>

          <div class="form-group" id="turmaGrupo">
            <label>🎓 Turma</label>
            <input id="turmaRegistro" type="text" placeholder="Ex: 6º A">
          </div>

          <div class="form-group" id="codigoGrupo" style="display:none;">
            <label>🔐 Código de Professor</label>
            <input id="codigoRegistro" type="password" placeholder="Digite o código fornecido pelo administrador">
            <small style="color:#666;margin-top:6px;display:block;">Peça o código ao administrador da horta</small>
          </div>

          <div class="form-group">
            <label>📧 Email</label>
            <input id="emailRegistro" type="email" placeholder="seu.email@escola.com">
          </div>

          <div class="form-group">
            <label>🔑 Senha</label>
            <input id="senhaRegistro" type="password" placeholder="••••••••">
          </div>

          <div class="form-group">
            <label>🔑 Confirmar Senha</label>
            <input id="confirmarSenhaRegistro" type="password" placeholder="••••••••">
          </div>

          <button id="btnRegistro" class="btn btn-primary">✓ Criar Conta</button>
        </div>
      </div>

      <!-- FOOTER -->
      <div class="footer-login">
        <small>&copy; 2025 Horta Escolar Automatizada</small>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import { getFirestore, collection, addDoc, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCrd7l_TwnRddpcK0eMDVeiYX9ynxbQsJ8",
      authDomain: "horta-automatica.firebaseapp.com",
      projectId: "horta-automatica",
      storageBucket: "horta-automatica.appspot.com",
      messagingSenderId: "177154489173",
      appId: "1:177154489173:web:8e223df0bc0715525c4ddc"
    };

    if (!getApps().length) initializeApp(firebaseConfig);
    const auth = getAuth();
    const db = getFirestore();

    // CÓDIGO MESTRE PARA PROFESSOR (mude isso!)
    const CODIGO_PROFESSOR = "horta2025";

    // ===== MUDAR ABA =====
    window.mudarAba = function(aba) {
      document.querySelectorAll(".tab-content").forEach(el => el.classList.remove("active"));
      document.querySelectorAll(".tab-btn").forEach(el => el.classList.remove("active"));
      document.getElementById(aba).classList.add("active");
      event.target.classList.add("active");
    }

    // ===== MOSTRAR/OCULTAR TURMA =====
    document.querySelectorAll('input[name="tipo"]').forEach(radio => {
      radio.addEventListener("change", () => {
        const tipo = document.querySelector('input[name="tipo"]:checked').value;
        const turmaGrupo = document.getElementById("turmaGrupo");
        const codigoGrupo = document.getElementById("codigoGrupo");

        if (tipo === "aluno") {
          turmaGrupo.style.display = "block";
          codigoGrupo.style.display = "none";
        } else {
          turmaGrupo.style.display = "none";
          codigoGrupo.style.display = "block";
        }
      });
    });

    // ===== FUNÇÕES UTILITÁRIAS =====
    function mostrarErro(elementId, msg) {
      const el = document.getElementById(elementId);
      el.textContent = msg;
      el.classList.add("show");
      setTimeout(() => el.classList.remove("show"), 4000);
    }

    function mostrarSucesso(elementId, msg) {
      const el = document.getElementById(elementId);
      el.textContent = msg;
      el.classList.add("show");
      setTimeout(() => el.classList.remove("show"), 3000);
    }

    // ===== LOGIN =====
    const btnLogin = document.getElementById("btnLogin");
    if (btnLogin) {
      btnLogin.addEventListener("click", async () => {
        const email = document.getElementById("emailLogin").value.trim();
        const senha = document.getElementById("senhaLogin").value.trim();

        if (!email || !senha) {
          mostrarErro("erroLogin", "⚠️ Preencha email e senha");
          return;
        }

        btnLogin.disabled = true;
        btnLogin.textContent = "🔄 Entrando...";

        try {
          const credencial = await signInWithEmailAndPassword(auth, email, senha);
          const snap = await getDoc(doc(db, "users", credencial.user.uid));

          if (snap.exists()) {
            const funcao = snap.data().funcao;
            window.location.href = funcao === "professor" ? "professor.html" : "aluno.html";
          } else {
            mostrarErro("erroLogin", "❌ Usuário não encontrado");
          }
        } catch (erro) {
          console.error(erro);
          let msg = "❌ Erro ao fazer login";
          if (erro.code === "auth/user-not-found") msg = "❌ Email não cadastrado";
          if (erro.code === "auth/wrong-password") msg = "❌ Senha incorreta";
          if (erro.code === "auth/invalid-email") msg = "❌ Email inválido";
          mostrarErro("erroLogin", msg);
        } finally {
          btnLogin.disabled = false;
          btnLogin.textContent = "🚪 Entrar";
        }
      });
    }

    // ===== REGISTRO =====
    const btnRegistro = document.getElementById("btnRegistro");
    if (btnRegistro) {
      btnRegistro.addEventListener("click", async () => {
        const nome = document.getElementById("nomeRegistro").value.trim();
        const tipo = document.querySelector('input[name="tipo"]:checked').value;
        const turma = document.getElementById("turmaRegistro").value.trim();
        const codigo = document.getElementById("codigoRegistro").value.trim();
        const email = document.getElementById("emailRegistro").value.trim();
        const senha = document.getElementById("senhaRegistro").value.trim();
        const confirmarSenha = document.getElementById("confirmarSenhaRegistro").value.trim();

        if (!nome || !email || !senha) {
          mostrarErro("erroRegistro", "⚠️ Preencha todos os campos");
          return;
        }

        if (senha !== confirmarSenha) {
          mostrarErro("erroRegistro", "❌ As senhas não conferem");
          return;
        }

        if (senha.length < 6) {
          mostrarErro("erroRegistro", "❌ Senha deve ter no mínimo 6 caracteres");
          return;
        }

        if (tipo === "aluno" && !turma) {
          mostrarErro("erroRegistro", "⚠️ Selecione sua turma");
          return;
        }

        if (tipo === "professor" && codigo !== CODIGO_PROFESSOR) {
          mostrarErro("erroRegistro", "❌ Código de professor inválido");
          return;
        }

        btnRegistro.disabled = true;
        btnRegistro.textContent = "🔄 Criando conta...";

        try {
          const credencial = await createUserWithEmailAndPassword(auth, email, senha);
          const uid = credencial.user.uid;

          const userData = {
            nome,
            email,
            funcao: tipo,
            criadoEm: new Date(),
            ...(tipo === "aluno" && { turma })
          };

          await setDoc(doc(db, "users", uid), userData);

          mostrarSucesso("sucessoRegistro", `✓ Conta criada com sucesso! Redirecionando...`);

          setTimeout(() => {
            window.location.href = tipo === "professor" ? "professor.html" : "aluno.html";
          }, 1500);
        } catch (erro) {
          console.error(erro);
          let msg = "❌ Erro ao criar conta";
          if (erro.code === "auth/email-already-in-use") msg = "❌ Email já cadastrado";
          if (erro.code === "auth/weak-password") msg = "❌ Senha muito fraca";
          if (erro.code === "auth/invalid-email") msg = "❌ Email inválido";
          mostrarErro("erroRegistro", msg);
        } finally {
          btnRegistro.disabled = false;
          btnRegistro.textContent = "✓ Criar Conta";
        }
      });
    }

    // ===== VERIFICAR SE JÁ ESTÁ LOGADO =====
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        const snap = await getDoc(doc(db, "users", user.uid));
        if (snap.exists()) {
          const funcao = snap.data().funcao;
          window.location.href = funcao === "professor" ? "professor.html" : "aluno.html";
        }
      }
    });
  </script>
</body>
</html>
