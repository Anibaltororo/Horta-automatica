<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login - Horta Escolar</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .login-container {
      max-width: 400px;
      margin: 60px auto;
      background: var(--card);
      padding: 30px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .login-container h1 { text-align: center; margin-bottom: 20px; }
    .login-container input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #e6eef0;
      border-radius: 8px;
      font-size: 14px;
    }
    .login-container button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }
    .login-container button:hover { opacity: 0.9; }
    .login-container small { display: block; margin-top: 10px; color: var(--muted); text-align: center; }
    .error { color: #dc2626; font-size: 13px; margin-top: 10px; }
  </style>
</head>
<body>
  <header class="topbar">
    <h1>🌱 Horta Escolar Automatizada</h1>
  </header>

  <div class="login-container">
    <h1>Fazer Login</h1>
    <input id="email" type="email" placeholder="Email">
    <input id="senha" type="password" placeholder="Senha">
    <button id="btnLogin">Entrar</button>
    <button id="btnRegistro" style="background:#6b7280;margin-top:5px">Registrar</button>
    <div id="erro" class="error"></div>
    <small>Escolha sua função após registrar</small>
  </div>

  <script type="module" src="auth.js"></script>
</body>
</html>
