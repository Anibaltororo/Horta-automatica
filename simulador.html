<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Simulador - Horta</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background: linear-gradient(135deg, #f0f7f4 0%, #e8f5e9 100%);
      padding: 20px; 
    }
    .container { 
      max-width: 700px; 
      margin: 0 auto; 
      background: #fff; 
      padding: 30px; 
      border-radius: 16px; 
      box-shadow: 0 10px 30px rgba(27, 94, 32, 0.15);
    }
    h1 { 
      color: #1b5e20; 
      margin-bottom: 24px;
      font-size: 28px;
    }
    .status { 
      background: linear-gradient(135deg, #f0fdf4 0%, #e8f5e9 100%);
      padding: 16px; 
      border-radius: 8px; 
      border-left: 4px solid #1b5e20;
      margin-bottom: 24px;
      font-weight: 600;
      color: #1b5e20;
    }
    .status.ativo { 
      background: linear-gradient(135deg, #dcfce7 0%, #e0f2fe 100%);
      color: #166534;
    }
    .btn-group {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    button { 
      background: linear-gradient(135deg, #1b5e20 0%, #2e8b57 100%);
      color: #fff; 
      padding: 12px 20px; 
      border: none; 
      border-radius: 8px; 
      cursor: pointer; 
      font-weight: 700;
      font-size: 14px;
      transition: all 0.3s;
      box-shadow: 0 4px 12px rgba(27, 94, 32, 0.3);
    }
    button:hover { 
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(27, 94, 32, 0.4);
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    button.parar { 
      background: linear-gradient(135deg, #dc2626 0%, #991b1b 100%);
      box-shadow: 0 4px 12px rgba(220, 38, 38, 0.3);
    }
    button.parar:hover {
      box-shadow: 0 6px 20px rgba(220, 38, 38, 0.4);
    }
    h3 {
      color: #1b5e20;
      margin-top: 28px;
      margin-bottom: 16px;
      font-size: 16px;
    }
    .leitura-box {
      background: linear-gradient(135deg, #f9fdf8 0%, #f0fdf4 100%);
      padding: 20px;
      border-radius: 10px;
      border: 2px solid #d0e8d8;
      margin-bottom: 20px;
    }
    .leitura-box p {
      margin: 10px 0;
      font-size: 15px;
      color: #1a3a34;
    }
    .leitura-box strong {
      color: #1b5e20;
      font-weight: 700;
    }
    .log { 
      background: #f9faf8; 
      padding: 16px; 
      border-radius: 8px; 
      max-height: 400px; 
      overflow-y: auto; 
      font-size: 12px; 
      font-family: 'Courier New', monospace;
      border: 1px solid #d0e8d8;
    }
    .log div { 
      margin: 6px 0; 
      padding: 4px 0;
    }
    .log .sucesso { 
      color: #16a34a; 
      font-weight: 700;
    }
    .log .erro { 
      color: #dc2626; 
    }
    .log .info {
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🌱 Simulador de Leituras - Horta Escolar</h1>
    
    <div class="status ativo" id="status">
      🟢 Simulador iniciado automaticamente!
    </div>

    <div class="btn-group">
      <button id="btnIniciar" style="display:none;">▶️ Iniciar Simulador</button>
      <button id="btnParar" class="parar">⏹️ Parar Simulador</button>
      <button onclick="location.reload()" style="background:linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);">🔄 Recarregar</button>
    </div>

    <h3>📊 Última Leitura Enviada:</h3>
    <div class="leitura-box">
      <p><strong>🌡️ Temperatura:</strong> <span id="ultimaTemp">-- °C</span></p>
      <p><strong>💧 Umidade:</strong> <span id="ultimaUmidade">-- %</span></p>
      <p><strong>☀️ Luminosidade:</strong> <span id="ultimaLumi">-- lux</span></p>
      <p><strong>🌱 pH:</strong> <span id="ultimaPH">-- </span></p>
      <p><strong>⏰ Horário:</strong> <span id="ultimaHora">--:--:--</span></p>
    </div>

    <h3>📝 Log de Atividades:</h3>
    <div class="log" id="log">
      <div class="info">🔄 Inicializando simulador...</div>
    </div>
  </div>

  <script type="module">
    import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCrd7l_TwnRddpcK0eMDVeiYX9ynxbQsJ8",
      authDomain: "horta-automatica.firebaseapp.com",
      projectId: "horta-automatica",
      storageBucket: "horta-automatica.appspot.com",
      messagingSenderId: "177154489173",
      appId: "1:177154489173:web:8e223df0bc0715525c4ddc"
    };

    if (!getApps().length) initializeApp(firebaseConfig);
    const db = getFirestore();

    let intervalo = null;
    let ativo = true;

    function gerarTemperatura() {
      const base = 25;
      const variacao = (Math.random() - 0.5) * 8;
      return parseFloat((base + variacao).toFixed(2));
    }

    function gerarUmidade() {
      const base = 65;
      const variacao = (Math.random() - 0.5) * 40;
      return Math.max(40, Math.min(85, Math.round(base + variacao)));
    }

    function gerarLuminosidade() {
      const hora = new Date().getHours();
      const lutbrilho = 6000 + Math.sin((hora / 24) * Math.PI) * 3000;
      const variacao = (Math.random() - 0.5) * 1000;
      return Math.max(100, Math.round(lutbrilho + variacao));
    }

    function gerarPH() {
      const base = 6.8;
      const variacao = (Math.random() - 0.5) * 1.2;
      return parseFloat((base + variacao).toFixed(2));
    }

    function adicionarLog(msg, tipo = "info") {
      const logEl = document.getElementById("log");
      const div = document.createElement("div");
      div.className = tipo;
      div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
      logEl.appendChild(div);
      logEl.scrollTop = logEl.scrollHeight;
    }

    async function enviarLeituras() {
      if (!ativo) return;

      try {
        const temperatura = gerarTemperatura();
        const umidade = gerarUmidade();
        const luminosidade = gerarLuminosidade();
        const ph = gerarPH();

        const dadosSensores = {
          temperatura,
          umidade,
          luminosidade,
          ph,
          ultimaAtualizacao: new Date().toISOString()
        };

        await setDoc(doc(db, "sensores", "horta"), dadosSensores);

        document.getElementById("ultimaTemp").textContent = temperatura + " °C";
        document.getElementById("ultimaUmidade").textContent = umidade + " %";
        document.getElementById("ultimaLumi").textContent = luminosidade + " lux";
        document.getElementById("ultimaPH").textContent = ph;
        document.getElementById("ultimaHora").textContent = new Date().toLocaleTimeString();

        adicionarLog(`✅ Enviado: ${temperatura}°C | ${umidade}% | ${luminosidade}lux | pH ${ph}`, "sucesso");

        await atualizarHistorico(temperatura, umidade, luminosidade, ph);

      } catch (erro) {
        console.error("Erro completo:", erro);
        adicionarLog(`❌ Erro: ${erro.message}`, "erro");
      }
    }

    async function atualizarHistorico(temp, umidade, luminosidade, ph) {
      try {
        const snap = await getDoc(doc(db, "historico", "dados"));
        let historico = snap.exists() ? snap.data() : { temperatura: [], umidade: [], luminosidade: [], ph: [] };

        historico.temperatura = (historico.temperatura || []);
        historico.umidade = (historico.umidade || []);
        historico.luminosidade = (historico.luminosidade || []);
        historico.ph = (historico.ph || []);

        historico.temperatura.push(temp);
        historico.umidade.push(umidade);
        historico.luminosidade.push(luminosidade);
        historico.ph.push(ph);

        if (historico.temperatura.length > 168) {
          historico.temperatura = historico.temperatura.slice(-168);
          historico.umidade = historico.umidade.slice(-168);
          historico.luminosidade = historico.luminosidade.slice(-168);
          historico.ph = historico.ph.slice(-168);
        }

        await setDoc(doc(db, "historico", "dados"), historico);
      } catch (erro) {
        console.error("Erro ao atualizar histórico:", erro);
      }
    }

    // Iniciar imediatamente
    console.log("Iniciando simulador...");
    setTimeout(() => {
      enviarLeituras();
      adicionarLog("🚀 Primeira leitura enviada!", "sucesso");
    }, 500);

    intervalo = setInterval(() => {
      if (ativo) {
        enviarLeituras();
      }
    }, 5000);

    document.getElementById("btnParar").addEventListener("click", () => {
      ativo = false;
      document.getElementById("btnIniciar").style.display = "inline-block";
      document.getElementById("btnParar").style.display = "none";
      document.getElementById("status").textContent = "🔴 Simulador parado";
      document.getElementById("status").classList.remove("ativo");
      adicionarLog("⏹️ Simulador parado", "info");
    });

    document.getElementById("btnIniciar").addEventListener("click", () => {
      ativo = true;
      document.getElementById("btnIniciar").style.display = "none";
      document.getElementById("btnParar").style.display = "inline-block";
      document.getElementById("status").textContent = "🟢 Simulador ativo";
      document.getElementById("status").classList.add("ativo");
      adicionarLog("🚀 Simulador reiniciado!", "sucesso");
      enviarLeituras();
    });
  </script>
</body>
</html>
